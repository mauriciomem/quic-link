version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - makezero
    - nilerr

  settings:
    govet:
      enable:
        - nilness
    staticcheck:
      checks:
        - "SA*"

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        text: "SA1019"
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0