syntax = "proto3";

package quiclink.v1;

option go_package = "github.com/mauriciomem/quic-link/internal/control/proto;controlpb";

// Control is the agent's management plane, served over the single per-session
// control stream. Additive changes (new RPCs/fields) do NOT bump the wire
// ProtoVersion; changing an existing field's semantics does.
service Control {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // AddVhost publishes a hostname on this agent while it is running. The
  // agent may refuse: an operator has to allow remote changes before any
  // caller may make one, and a refusal for that reason is a permission
  // error rather than a transport failure. An agent that was built or wired
  // without the ability to change its own names at all reports the method as
  // unimplemented, which is the same answer a caller gets from an agent too
  // old to have it — from the caller's side those are one fact.
  //
  // Anything added this way lasts only as long as the process: the name
  // table is rebuilt from configuration at every start.
  rpc AddVhost(AddVhostRequest) returns (AddVhostResponse);
  // ListVhosts reports every name this agent publishes, whether it came from
  // the operator's configuration or was added while the agent was running.
  //
  // It reads and changes nothing, so it needs no consent from the agent's
  // operator: a caller that is already authenticated may ask what a name table
  // holds. Until this existed nothing disclosed a published name at all, so an
  // agent's own log was the only record of one and it went away with the
  // process.
  rpc ListVhosts(ListVhostsRequest) returns (ListVhostsResponse);
  // RemoveVhost takes back a name that was published over this connection while
  // the agent was running. It changes what the agent serves, so like publishing
  // it is refused unless the agent's operator allowed remote changes.
  //
  // A name from the operator's configuration is refused whatever the setting
  // says: no permission makes somebody's own configuration remotely removable.
  // That refusal is deliberately not a permission error, because telling a
  // caller to ask for permission would send them to change a setting that
  // cannot help.
  rpc RemoveVhost(RemoveVhostRequest) returns (RemoveVhostResponse);
}

message PingRequest {
  // nonce is echoed back verbatim so the client can match a reply to its
  // request. RTT is measured on the client from its own send/receive clock;
  // the agent's clock is informational only (agent_unix_ms).
  int64 nonce = 1;
}

message PingResponse {
  int64 nonce = 1;
  int64 agent_unix_ms = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  int64 started_unix_ms = 2;
  repeated RouteInfo routes = 3;
}

message RouteInfo {
  string target = 1;
  string address = 2;
  // builtin reports only whether this entry is still a compiled-in default.
  // It is kept because callers already read it; provenance below is the
  // authoritative answer and can say more.
  bool builtin = 3;
  // provenance says where the entry came from: a compiled-in default, the
  // operator's configuration, or something added while the agent was
  // running. A peer too old to send it leaves it empty, which a reader must
  // tolerate rather than treat as a fourth kind.
  string provenance = 4;
}

message AddVhostRequest {
  // host is the whole name a browser will ask for, already lowercased by the
  // caller, e.g. "grafana.server1.internal".
  string host = 1;
  // port is a port on the agent's own loopback interface, and the only thing
  // a caller may say about where traffic goes.
  //
  // It is a port and not an address on purpose. An address field would let a
  // caller name any destination the agent can reach — a unix socket carrying
  // a privileged API, a machine somewhere else on the agent's network — and
  // turning the agent into a general-purpose forwarder for whatever a caller
  // names is precisely what the route table exists to prevent. A field that
  // cannot express a destination has no edge case a validator could miss.
  uint32 port = 2;
}

message RemoveVhostRequest {
  // host is the whole name to withdraw, as it was published.
  string host = 1;
}

message RemoveVhostResponse {
  // host echoes the name that was withdrawn.
  string host = 1;
  // shadowed_by names a pattern that resumes serving the name now the exact
  // entry is gone, and is empty when nothing does. A withdrawal can be true and
  // still leave the name answered, at a different address, and a caller told
  // only "done" would have no way to know.
  string shadowed_by = 2;
}

message ListVhostsRequest {}

message ListVhostsResponse {
  repeated VhostInfo vhosts = 1;
}

message VhostInfo {
  // host is the whole name, with its star if it is a pattern.
  string host = 1;
  // address is where the name points, as configured.
  string address = 2;
  // builtin is carried for symmetry with a route entry. No published name is
  // compiled in, so it is always false; provenance is the field that
  // distinguishes configuration from a runtime addition.
  bool builtin = 3;
  // provenance says where the entry came from. A peer too old to send it leaves
  // it empty, which a reader must tolerate rather than treat as another kind.
  string provenance = 4;
}

message AddVhostResponse {
  // host and port echo what was actually published, after validation, so the
  // caller reports the name that really exists rather than the one it asked
  // for.
  string host = 1;
  uint32 port = 2;
}
