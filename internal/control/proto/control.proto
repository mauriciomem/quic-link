syntax = "proto3";

package quiclink.v1;

option go_package = "github.com/mauriciomem/quic-link/internal/control/proto;controlpb";

// Control is the agent's management plane, served over the single per-session
// control stream. Additive changes (new RPCs/fields) do NOT bump the wire
// ProtoVersion; changing an existing field's semantics does.
service Control {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message PingRequest {
  // nonce is echoed back verbatim so the client can match a reply to its
  // request. RTT is measured on the client from its own send/receive clock;
  // the agent's clock is informational only (agent_unix_ms).
  int64 nonce = 1;
}

message PingResponse {
  int64 nonce = 1;
  int64 agent_unix_ms = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  int64 started_unix_ms = 2;
  repeated RouteInfo routes = 3;
}

message RouteInfo {
  string target = 1;
  string address = 2;
  // builtin reports only whether this entry is still a compiled-in default.
  // It is kept because callers already read it; provenance below is the
  // authoritative answer and can say more.
  bool builtin = 3;
  // provenance says where the entry came from: a compiled-in default, the
  // operator's configuration, or something added while the agent was
  // running. A peer too old to send it leaves it empty, which a reader must
  // tolerate rather than treat as a fourth kind.
  string provenance = 4;
}
