# The suite, on both platforms the quic-link project supports, plus a cross-compile check.
#
# Every job calls a script from scripts/ rather than spelling out its steps, so
# what CI runs and what a developer runs are the same thing by construction. If
# you want to reproduce a failure here, run the same script locally.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned rather than read from go.mod. 
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Show the toolchain being used
        run: go version
      - name: Build, vet, and run the suite with its result counts
        run: ./scripts/test.sh

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Run the suite under the race detector
        run: ./scripts/test.sh --race

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Build every supported platform
        run: ./scripts/cross.sh
