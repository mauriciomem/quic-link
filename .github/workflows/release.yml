# Publish a release when a version tag is pushed.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum

      - name: Record the toolchain
        run: go version

      - name: Run the suite in the shipping configuration
        run: ./scripts/test.sh --tags grpcnotrace

      - name: Build the release artifacts
        run: ./scripts/release.sh "${GITHUB_REF_NAME}" --check

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag carrying a semver pre-release part - v0.1.0-rc.1, v0.2.0-beta.1 -
          # is published as a pre-release, so it is never presented as the version to
          # download and never becomes "Latest". Without this a release-candidate tag
          # would look exactly like a finished release to anyone visiting the page.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
          *-*) prerelease="--prerelease" ;;
          esac

          # shellcheck disable=SC2086 # $prerelease is a single optional flag.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft \
            $prerelease \
            dist/*.tar.gz dist/SHA256SUMS
