# Static analysis, vulnerability scanning, and protocol-compatibility gates.
#
# Separate from test.yml because these answer different questions and fail for
# different reasons: test.yml asks whether the code works, this asks whether it
# is safe to ship and whether it kept its promises to existing peers.
#
# Every gate here was checked to FAIL when it should before being added. A gate
# nobody has watched fail is a decoration.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Scan for vulnerabilities this code reaches
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Every benchmark still compiles and runs
        run: ./scripts/bench.sh --check

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf compares against a git ref, so the history has to be present.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache-dependency-path: go.sum
      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          buf --version
      # Style rules are configured in buf.yaml
      - name: Proto lint
        run: buf lint
      - name: Proto compatibility against the base branch
        run: buf breaking --against '.git#ref=origin/${{ github.base_ref || github.event.repository.default_branch }}'
